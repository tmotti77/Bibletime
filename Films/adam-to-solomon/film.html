<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cinecode quick mode: film.html (picture + sound in one file)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #999; font: 12px/1.4 ui-monospace, Menlo, monospace; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; margin: 0 auto; }
  #hud { position: fixed; left: 8px; bottom: 6px; opacity: .75; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">click to play with sound · space pause · arrows step</div>
<script>
// cinecode QUICK MODE starter. One file holds the whole film: timeline, scenes, on-screen text and the sound.
//
// Contract used by tools/capture.mjs:
//   window.READY            Promise<{frames, fps, width, height, renderer, title, bounds, vo}>, resolves after fonts are
//                           loaded (bounds = scene starts + the end, for tools/make.py and the per-scene checks)
//   window.renderFrame(i)   draws frame i; a pure function of (i / FPS, SEED); nothing carried between frames
//   window.captureFrame(i)  renderFrame(i) + returns a PNG/JPEG data URL of the canvas
//   window.renderAudio()    Promise<AudioBuffer>: the whole soundtrack, rendered OFFLINE (OfflineAudioContext)
// URL params: w, h (default 1080x1920 = 9:16), seed, capture=1 (set by capture.mjs: no preview loop),
//             shutter=<samples> (0 = motion blur off, for drafts), weave=<px>, tone=0 (finishing overrides)
//
// Renders: python3 tools/make.py stills | draft | final (KIT/references/quick-mode.md §3-4). It captures, lays the
// narration on the score (audio/mix.json), masters to -14 LUFS and runs the checks; never chain capture.mjs,
// master_audio.py and qc.py by hand.
//
// Edit only the FILM section below: TITLE, PURPOSE, FINISH, DURATION, PALETTE, TYPE (roles, check), CUES, VO, SCENES, SFX, ROOM,
// ARRANGEMENT, the scene functions and score(). Helpers stay as they are: EASE, MOTION (at, back, anticipate, spring, stagger, arc), CAM (pan, tilt, dolly, zoom, truck, crane, orbit, dollyZoom,
// pushTo, fpv, handheld, matchFrom, rackFocus), retime() (speed ramp, slow motion, time-lapse, freeze), plane(),
// TRANSITION (dissolve, wipe, whip, iris), lazy() (seeded data built once), label() (on-screen names), and the sound voices.
// Seeded data (star fields, layouts) is built with lazy() and first used inside a draw call: SEED is set further down
// the file, so a top-level rng() call here would run before it.

// ============================== FILM ==============================
const TITLE = 'From a Garden to a Temple';
// Purpose (SKILL.md "First questions"): 'cinematic' or 'ad'.
const PURPOSE = 'cinematic';
// Look: authored for this film. A floor mosaic of the biblical lands: every picture set in small uneven stones with
// mortar between, cream ground, lapis, terracotta, green and gold, words cut into stone plaques, and one row of red
// stones running through every scene. Drawings hold on twos, so the stones settle instead of shimmering.
const LOOKS = {
  'sunset-silhouette': { grade: 'contrast(1.05) saturate(1.12)', bloom: 0.12, texture: null, vignette: 0.5, grain: 0.05, grainHold: 1, hold: 24, line: 0, steps: 0,
    palette: { bg: '#f28a3c', ink: '#0b0710', accent: '#ff5038', dim: '#3a2a44', blue: '#27406b', green: '#16301f', gold: '#ffcf6a' } },
};
const LOOK_ID = new URLSearchParams(location.search).get('look') || 'sunset-silhouette';
const LOOK = LOOKS[LOOK_ID] ?? LOOKS['sunset-silhouette'];
const FINISH = { shutter: null, weave: 0, tone: null };
const FPS = 24;
const DURATION = 180;                       // seconds; the picture and the sound both follow this
const BPM = 90;                             // placeholder until the recording is picked and measured
const BEAT0 = 0;
const beat = (n) => BEAT0 + n * 60 / BPM, bar = (n) => beat(4 * n);
const OWN_MUSIC = null;
const INSTRUMENTS = [];
const CAST = {};
const FORMULAS = {};
const PALETTE = { ...LOOK.palette };
const TYPE = {
  lang: 'en',
  roles: {
    display: { family: 'Cinzel', files: { 400: 'fonts/cinzel-latin-400-normal.woff2', 700: 'fonts/cinzel-latin-700-normal.woff2' } },
    text: { family: 'Old Standard TT', files: { 400: 'fonts/old-standard-tt-latin-400-normal.woff2', 700: 'fonts/old-standard-tt-latin-700-normal.woff2' } },
    mono: null,
  },
  check: { strings: { display: [TITLE] }, sizes: { text: 0.04 } },
};

// Cues are shared by picture and sound. Chapter starts first, then the moments inside them.
const CUES = {
  c1: 0, c2: 16, c3: 32, c4: 46, c5: 64, c6: 80, sea: 90, c7: 102, c8: 118, c9: 134, c10: 156, end: DURATION,
  treeUp: 2.6, fruit: 10.5, split: 94,
};

const VO = [];
const CAPTIONS = null;
const CAPTION_STYLE = { role: 'display', accentRole: 'display', size: 0.062, caps: false, ink: PALETTE.ink, hi: PALETTE.ink, accent: PALETTE.accent, punch: 0.07 };

const SCENES = [
  { chapter: 'C1', from: CUES.c1, to: CUES.c2, draw: M(c1_eden), action: 'the red line grows into a tree; a hand takes the fruit; the garden loses its colour', amb: { kind: 'air', gain: 0.05 } },
  { chapter: 'C2', from: CUES.c2, to: CUES.c3, draw: M(c2_flood), action: 'the water rises over the world and lifts the ark; the line leaves it as a rainbow', in: { type: 'wipe', dur: 0.5 }, amb: { kind: 'water', gain: 0.07 } },
  { chapter: 'C3', from: CUES.c3, to: CUES.c4, draw: M(c3_babel), action: 'the tower builds brick by brick, breaks at the top and the line scatters into threads', in: { type: 'cut' }, amb: { kind: 'air', gain: 0.05 } },
  { chapter: 'C4', from: CUES.c4, to: CUES.c5, draw: M(c4_abraham), action: 'one thread is followed; night falls and the stars come out one by one; a ladder rises', in: { type: 'whip', dur: 0.5 }, amb: { kind: 'air', gain: 0.04 } },
  { chapter: 'C5', from: CUES.c5, to: CUES.c6, draw: M(c5_joseph), action: 'the coat is given, the boy is dropped into the pit, the line falls down the page into Egypt and the grain rises', in: { type: 'dissolve', dur: 0.6 }, amb: { kind: 'air', gain: 0.05 } },
  { chapter: 'C6', from: CUES.c6, to: CUES.sea, draw: M(c6_moses), action: 'bricks are stacked under the whip; a bush catches fire and does not burn; a man kneels', in: { type: 'cut' }, amb: { kind: 'air', gain: 0.05 } },
  { chapter: 'C6', from: CUES.sea, to: CUES.c7, draw: M(c6_sea), action: 'the sea splits into two walls and the people walk through', in: { type: 'cut' }, amb: { kind: 'water', gain: 0.07 } },
  { chapter: 'C7', from: CUES.c7, to: CUES.c8, draw: M(c7_sinai), action: 'the mountain smokes and the line climbs it; ten lines are cut into two tablets; the line coils forty times across the desert', in: { type: 'dissolve', dur: 0.6 }, amb: { kind: 'air', gain: 0.06 } },
  { chapter: 'C8', from: CUES.c8, to: CUES.c9, draw: M(c8_land), action: 'seven horns sound and the wall of Jericho falls block by block; the line loops through the Judges; Ruth gleans', in: { type: 'whip', dur: 0.5 }, amb: { kind: 'air', gain: 0.05 } },
  { chapter: 'C9', from: CUES.c9, to: CUES.c10, draw: M(c9_david), action: 'a sling stone crosses the valley and the giant falls; harp strings are strung and played; a crown comes down; a city fills its hill', in: { type: 'cut' }, amb: { kind: 'air', gain: 0.05 } },
  { chapter: 'C10', from: CUES.c10, to: CUES.end, draw: M(c10_solomon), action: 'the Temple rises stone by stone, the line drops as a plumb line and settles, gold floods the stone, and the whole chart is seen', in: { type: 'dissolve', dur: 0.6 }, amb: { kind: 'room', gain: 0.05 } },
];

const SFX = [];
const ROOM = { secs: 2.2, decay: 3.2, tone: 5000 };
const ARRANGEMENT = [
  { section: 'all', from: 0, to: CUES.end, parts: [] },
];


// ------------------------------ the silhouette kit ------------------------------
// Every chapter has its own painted sky; everything in front of it is a silhouette lit from behind.
const MOODS = {
  1: { sky: ['#1b1440', '#5b2a6e', '#c2456a', '#f28a3c', '#ffd98a'], sun: [0.34, 0.66], far: '#7a3a6c', mid: '#3a1c44' },
  2: { sky: ['#0c1420', '#1d2a3a', '#3a4a58', '#62727c', '#98a2a6'], sun: null, far: '#2c3a48', mid: '#18222c' },
  3: { sky: ['#2a0f1a', '#7a2a1e', '#c8552a', '#f0a040', '#ffe0a0'], sun: [0.72, 0.7], far: '#8a3a2a', mid: '#4a1c18' },
  4: { sky: ['#141a44', '#3a3a7a', '#8a4a7a', '#e08a5a', '#ffd9a0'], sun: null, far: '#3a2f5a', mid: '#1c1830' },
  5: { sky: ['#3a2410', '#a8641e', '#e8a23a', '#ffd27a', '#fff0c0'], sun: [0.62, 0.52], far: '#8a5424', mid: '#5a3416' },
  6: { sky: ['#0a1a2a', '#14404e', '#2f7a7a', '#e0b070', '#fff0c0'], sun: null, far: '#1f4a54', mid: '#102a32' },
  7: { sky: ['#1a0a14', '#4a1420', '#9a2a22', '#e0602a', '#ffb060'], sun: [0.2, 0.72], far: '#5a1e24', mid: '#2a0e14' },
  8: { sky: ['#0a0608', '#2a0c0c', '#5a1a12', '#a0401a', '#e08a3a'], sun: null, far: '#2a1010', mid: '#160808' },
  9: { sky: ['#2a1a3a', '#8a4a5a', '#e08a4a', '#ffc870', '#fff0c0'], sun: [0.76, 0.6], far: '#8a4a4a', mid: '#44242c' },
  10: { sky: ['#101838', '#3a3a78', '#b0608a', '#f0a070', '#ffe0b0'], sun: [0.24, 0.68], far: '#5a3a6a', mid: '#2a1c38' },
  11: { sky: ['#3a1a08', '#a85a12', '#f0a428', '#ffd870', '#fff6d0'], sun: [0.5, 0.62], far: '#a8662a', mid: '#5a3210' },
};
let MOOD = MOODS[1];
const SIL = '#0b0710';
function stroke(g, pts, w, color, k = 1, alpha = 1) {
  if (k <= 0 || pts.length < 2) return;
  const n = (pts.length - 1) * clamp(k), full = Math.floor(n), f = n - full, lit = color === PALETTE.accent || color === STARLIGHT || color === PALETTE.gold;
  g.save(); g.globalAlpha *= alpha; g.strokeStyle = color; g.lineWidth = Math.max(w, 0.003); g.lineCap = 'round'; g.lineJoin = 'round';
  if (lit) { g.shadowColor = color; g.shadowBlur = S.u * 0.014; }
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i <= full; i++) g.lineTo(pts[i][0], pts[i][1]);
  if (f > 0 && full + 1 < pts.length) g.lineTo(lerp(pts[full][0], pts[full + 1][0], f), lerp(pts[full][1], pts[full + 1][1], f));
  g.stroke(); g.restore();
}
function hatch() {}                                   // no ruled shading in this look: light and haze do that work
// Colour in this look: a strong wash is light (a sun, fire, gold), a weak one a tint inside the shadow; blue is water.
function wash(g, path, color, alpha = 0.55) {
  if (alpha <= 0) return;
  g.save(); g.beginPath(); path(g);
  if (color === NIGHT) { g.globalAlpha *= Math.min(1, alpha * 1.15); g.fillStyle = '#080c24'; }
  else if (color === PALETTE.green) { g.globalAlpha *= Math.min(1, alpha * 2.4); g.fillStyle = SIL; }
  else if (color === PALETTE.dim) { g.globalAlpha *= Math.min(1, alpha * 2); g.fillStyle = MOOD.mid; }
  else if (color === PALETTE.gold || color === PALETTE.accent) { g.globalAlpha *= alpha > 0.5 ? Math.min(1, alpha * 1.2) : alpha * 0.4; g.fillStyle = color; }
  else { g.globalAlpha *= 0.94; g.fillStyle = '#101c30'; }
  g.fill(); g.restore();
}
// The sky behind every scene, in screen space: the chapter's gradient, its sun, long clouds that drift with the camera.
function chartPaper(g, S, cam, col = 1) {
  MOOD = MOODS[col] ?? MOODS[1];
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  const sk = g.createLinearGradient(0, 0, 0, S.H * 0.8); MOOD.sky.forEach((c, i) => sk.addColorStop([0, 0.3, 0.55, 0.78, 1][i], c)); g.fillStyle = sk; g.fillRect(0, 0, S.W, S.H);
  if (MOOD.sun) {
    const sx = MOOD.sun[0] * S.W - cam.x * S.u * 0.05, sy = MOOD.sun[1] * S.H, gl = g.createRadialGradient(sx, sy, 0, sx, sy, S.u * 0.75);
    gl.addColorStop(0, 'rgba(255,244,200,0.95)'); gl.addColorStop(0.12, 'rgba(255,214,130,0.7)'); gl.addColorStop(0.45, 'rgba(255,150,80,0.2)'); gl.addColorStop(1, 'rgba(255,120,80,0)');
    g.fillStyle = gl; g.fillRect(0, 0, S.W, S.H); g.fillStyle = '#fff6d8'; g.beginPath(); g.arc(sx, sy, S.u * 0.085, 0, TAU); g.fill();
  }
  for (let i = 0; i < 13; i++) {
    const n = col * 211 + i * 17, span = S.W * 1.6, cx = ((hash1(n) * span - cam.x * S.u * (0.1 + 0.12 * hash1(n + 3))) % span + span) % span - S.W * 0.3, cy = (0.08 + hash1(n + 1) * 0.5) * S.H, cw = (0.1 + hash1(n + 2) * 0.26) * S.W, ch = (0.008 + hash1(n + 4) * 0.02) * S.H;
    const cg = g.createLinearGradient(0, cy - ch, 0, cy + ch); cg.addColorStop(0, 'rgba(20,10,30,0.5)'); cg.addColorStop(1, 'rgba(255,190,130,0.45)');
    g.fillStyle = cg; g.beginPath(); g.ellipse(cx, cy, cw, ch, 0, 0, TAU); g.fill();
  }
  g.restore();
}
function lineage(g, x0, x1, y, w = 0.006) {
  if (x1 <= x0) return;
  stroke(g, [[x0, y], [x1, y]], Math.max(w, 0.006), PALETTE.accent);
}
function nib(g, x, y, r = 0.009) { g.save(); g.shadowColor = PALETTE.accent; g.shadowBlur = S.u * 0.03; g.fillStyle = '#ff7a5c'; g.beginPath(); g.arc(x, y, Math.max(0, r), 0, TAU); g.fill(); g.restore(); }
// A person as a silhouette with real proportions: legs, torso, neck, head, two arms. Returns the near hand.
function person(g, x, y, h, o = {}) {
  const f = o.face ?? 1, u = h / 8, lean = (o.lean ?? 0) * f * h * 0.9, st = Math.sin((o.p ?? 0) * TAU) * u * 0.7, hipY = y - u * 3.9, shY = y - u * 6.2 + Math.abs(lean) * 0.25, sx0 = x + lean;
  g.save(); g.fillStyle = SIL; g.strokeStyle = SIL; g.lineCap = 'round'; g.lineJoin = 'round';
  if (o.long !== false && !o.legs) {                  // a robe: one long shape from the shoulders to the feet
    g.beginPath(); g.moveTo(sx0 - u * 0.95, shY); g.quadraticCurveTo(sx0, shY - u * 0.45, sx0 + u * 0.95, shY); g.quadraticCurveTo(x + u * 1.05, y - u * 2.5, x + u * 1.15 + st * 0.4, y); g.lineTo(x - u * 1.15 + st * 0.4, y); g.quadraticCurveTo(x - u * 1.05, y - u * 2.5, sx0 - u * 0.95, shY); g.fill();
    g.lineWidth = u * 0.6; for (const s of [-1, 1]) { g.beginPath(); g.moveTo(x + s * u * 0.4, y - u * 0.4); g.lineTo(x + s * u * 0.45 + s * st, y + u * 0.02); g.stroke(); }
  } else {
    g.lineWidth = u * 0.85; for (const s of [-1, 1]) { g.beginPath(); g.moveTo(x + s * u * 0.4, hipY); g.lineTo(x + s * (u * 0.5 + st * 0.5), y - u * 2); g.lineTo(x + s * u * 0.5 + s * st, y); g.stroke(); }
    g.beginPath(); g.moveTo(sx0 - u * 0.95, shY); g.quadraticCurveTo(sx0, shY - u * 0.4, sx0 + u * 0.95, shY); g.lineTo(x + u * 0.75, hipY + u * 0.2); g.lineTo(x - u * 0.75, hipY + u * 0.2); g.closePath(); g.fill();
  }
  g.lineWidth = u * 0.5;
  const arm = (side, a) => { const ax = sx0 + side * u * 0.85, ay = shY + u * 0.15, ex = ax + Math.sin(a) * u * 1.45 * f, ey = ay + Math.cos(a) * u * 1.45, hx = ex + Math.sin(a * 1.12) * u * 1.4 * f, hy = ey + Math.cos(a * 1.12) * u * 1.4; g.beginPath(); g.moveTo(ax, ay); g.lineTo(ex, ey); g.lineTo(hx, hy); g.stroke(); return [hx, hy]; };
  arm(-f, 0.1 - st * 0.1); const hand = arm(f, lerp(0.15, 2.5, o.arm ?? 0));
  const hx = sx0 + lean * 0.3 + f * u * 0.08, hy = shY - u * 1.1;
  g.fillRect(sx0 + lean * 0.15 - u * 0.2, shY - u * 0.75, u * 0.4, u * 0.7);
  g.beginPath(); g.ellipse(hx, hy, u * 0.55, u * 0.62, 0, 0, TAU); g.fill();
  if ((o.salt ?? 0) % 3 === 0) { g.beginPath(); g.moveTo(hx - f * u * 0.6, hy - u * 0.2); g.quadraticCurveTo(hx - f * u * 1.1, hy + u * 1.4, hx - f * u * 0.5, hy + u * 2.2); g.lineTo(hx, hy + u * 0.6); g.closePath(); g.fill(); }     // long hair or a head cloth
  if (o.staff) { g.lineWidth = u * 0.22; g.beginPath(); g.moveTo(hand[0], hand[1] - u * 3.4); g.lineTo(hand[0], Math.min(y, hand[1] + u * 5.6)); g.stroke(); }
  g.restore();
  return hand;
}
// Ground whose top edge is y = f(x). Far ground is haze, mountains are a middle tone, near ground is black with grass.
function land(g, f, x0, x1, bottom, o = {}) {
  const far = (o.ang ?? 0.3) < 0.2, mid = !!o.cross;
  g.save(); g.fillStyle = far ? MOOD.far : mid ? MOOD.mid : SIL; g.beginPath(); g.moveTo(x0, bottom);
  for (let x = x0; x <= x1 + 1e-6; x += 0.03) g.lineTo(x, f(x));
  g.lineTo(x1, bottom); g.closePath(); g.fill();
  if (!far && !mid && o.fill !== false) { g.strokeStyle = SIL; g.lineWidth = 0.0026; g.lineCap = 'round'; g.beginPath(); for (let i = Math.ceil(x0 / 0.011); i * 0.011 < x1; i++) { const x = i * 0.011 + (hash1(i * 7 + 3) - 0.5) * 0.008, hh = 0.008 + 0.026 * hash1(i * 13 + 1), y = f(x); g.moveTo(x, y + 0.004); g.quadraticCurveTo(x + (hash1(i) - 0.5) * 0.01, y - hh * 0.5, x + (hash1(i + 9) - 0.5) * 0.022, y - hh); } g.stroke(); }
  g.restore();
}
// A cut stone or a brick: black against the sky, its joints caught by the light; gold when the gold comes.
function block(g, x, y, w, h, salt = 1, o = {}) {
  g.fillStyle = SIL; g.fillRect(x, y, w, h);
  if ((o.wash === PALETTE.gold || o.wash === PALETTE.accent) && (o.washA ?? 0.5) > 0.5) { g.save(); g.globalAlpha *= Math.min(1, ((o.washA ?? 0.5) - 0.5) * 2.4); g.fillStyle = o.wash === PALETTE.gold ? '#ffc94a' : o.wash; g.fillRect(x, y, w, h); g.restore(); }
  g.strokeStyle = 'rgba(255,200,140,0.22)'; g.lineWidth = 0.0014; g.strokeRect(x, y, w, h);
}
// Light on water: rows of glints.
function waves(g, x0, x1, y0, y1, t, rows, salt = 0) {
  g.save(); g.strokeStyle = MOOD.sky[4]; g.lineCap = 'round';
  for (let j = 0; j <= rows; j++) {
    const d = j / rows, y = lerp(y0, y1, d ** 1.4), amp = 0.003 + 0.007 * d, fr = 24 - 11 * d, ph = hash1(900 + salt + j) * 6;
    g.lineWidth = 0.0018 + 0.003 * d; g.globalAlpha = 0.16 + 0.3 * hash1(950 + salt + j); g.beginPath();
    for (let x = x0; x <= x1; x += 0.014) { const yy = y + amp * Math.sin(x * fr + t * (0.6 + d) + ph) + amp * 0.5 * Math.sin(x * fr * 2.3 - t + ph), on = Math.sin(x * 9 + j * 2.3 + t * 0.7) > -0.2; if (!on || x === x0) g.moveTo(x, yy); else g.lineTo(x, yy); }
    g.stroke();
  }
  g.restore();
}
// Words sit in the black bars of the frame: the line of the film below, the place and the book above.
const OVER = [];
function barText(g, S, str, x, y, size, a, align, weight = 700) {
  g.save(); g.setTransform(S.u / 100, 0, 0, S.u / 100, S.W / 2, S.H / 2); g.globalAlpha = a; setType(g, TYPE, 'display', size * 100, { short: 100, weight, track: 0.1 });
  g.textAlign = align; g.textBaseline = 'middle'; g.fillStyle = '#f4e6c8'; g.fillText(str, x * 100, y * 100); g.restore();
}
function card(g, S, str, t, t0, t1) {
  const a = Math.min(MOTION.at(t, t0, 0.5), 1 - MOTION.at(t, t1 - 0.5, 0.5));
  if (a > 0) OVER.push(() => barText(g, S, up(str.replace(/\.$/, ''), 'en'), 0, 0.458, 0.036, clamp(a), 'center'));
}
function place(g, S, str, t, t0, t1) {
  const a = Math.min(MOTION.at(t, t0, 0.5), 1 - MOTION.at(t, t1 - 0.5, 0.5));
  if (a > 0) OVER.push(() => barText(g, S, str, -0.84, -0.462, 0.027, clamp(a) * 0.9, 'left', 400));
}
function M(fn) {
  return (g, k, t, S) => {
    OVER.length = 0; fn(g, k, t, S);
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.fillStyle = '#000'; const bar = Math.round(S.H * 0.075); g.fillRect(0, 0, S.W, bar); g.fillRect(0, S.H - bar, S.W, bar); g.restore();
    for (const f of OVER) f(); OVER.length = 0;
  };
}

// ------------------------------ C1 Eden ------------------------------
const GY = 0.28;                                     // the height of the lineage line on every plate
const edenTree = lazy(() => {
  const r = rng(21), segs = [], tips = [];
  const grow = (x, y, a, len, w, d) => {
    const x1 = x + Math.cos(a) * len, y1 = y + Math.sin(a) * len; segs.push({ x, y, x1, y1, w, d });
    if (d >= 5) { tips.push([x1, y1, r()]); return; }

    os.connect(gv).connect(lp); os.start(t); os.stop(t + dur + 0.05);
  }
}
function stab(ctx, out, t, dur, freqs, gain, o = {}) {  // a chord stab: detuned saws through a low-pass, short
  const v = ctx.createGain(), lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = o.cutoff || 2200;
  env(v.gain, t, 0.004, gain, dur); lp.connect(v).connect(out);
  for (const f of freqs) for (const det of [-9, 9]) {
    const os = ctx.createOscillator(); os.type = 'sawtooth'; os.frequency.value = f; os.detune.value = det;
    const gv = ctx.createGain(); gv.gain.value = 1 / (freqs.length * 2); os.connect(gv).connect(lp); os.start(t); os.stop(t + dur + 0.05);
  }
}
function checkArrangement() {
  const errs = [];
  ARRANGEMENT.forEach((s, i) => {
    const prev = ARRANGEMENT[i - 1];
    if (s.to <= s.from) errs.push(`${s.section}: ends before it starts`);
    if (!prev && Math.abs(s.from) > 1e-6) errs.push(`${s.section}: the first section starts at 0`);
    if (prev && Math.abs(prev.to - s.from) > 1e-6) errs.push(`${prev.section} → ${s.section}: ${prev.to > s.from ? 'overlap' : 'gap'}`);
    if (new Set(s.parts).size !== s.parts.length) errs.push(`${s.section}: a part is listed twice`);
  });
  const end = ARRANGEMENT[ARRANGEMENT.length - 1];
  if (!end || Math.abs(end.to - DURATION) > 1e-6) errs.push('the last section ends at DURATION');
  if (errs.length) throw new Error('ARRANGEMENT: ' + errs.join('; '));
}

// Music ducks under the narration: depth 0.3 ≈ -10 dB, down 0.15 s before a line, back over 0.4 s after it.
function duck(param, level, lines, depth = 0.3) {
  param.setValueAtTime(level, 0);
  const spans = [];
  for (const { at, dur } of [...lines].sort((a, b) => a.at - b.at)) {
    const last = spans[spans.length - 1];
    if (last && at - 0.15 < last[1] + 0.4) last[1] = Math.max(last[1], at + dur); else spans.push([at, at + dur]);
  }
  for (const [s, e] of spans) {
    param.setValueAtTime(level, Math.max(0, s - 0.15)); param.linearRampToValueAtTime(level * depth, s);
    param.setValueAtTime(level * depth, e); param.linearRampToValueAtTime(level, e + 0.4);
  }
}

// Recorded instruments. sample(ctx, out, name, t, { note, vel, gain, pan }): pitched takes play the nearest recorded
// note re-pitched to `note` ('E5' or a MIDI number; over 4 semitones from a take stops the render unless o.stretch);
// unpitched ones pick a take by vel (0 quiet .. 1 loud). Levels are set per instrument, so the takes keep their dynamics.
const BANK = {};
async function loadSamples(ctx) {
  if (!INSTRUMENTS.length) return;
  const idx = await new Promise((ok, fail) => {
    const x = new XMLHttpRequest(); x.open('GET', 'audio/samples/index.json');
    x.onload = () => { try { ok(JSON.parse(x.responseText)); } catch (e) { fail(new Error('samples: audio/samples/index.json')); } };
    x.onerror = () => fail(new Error(`samples: run tools/samples.py get ${INSTRUMENTS.join(' ')}`)); x.send();
  });
  for (const name of INSTRUMENTS) {
    const takes = idx[name];
    if (!takes) throw new Error(`samples: ${name} is not in audio/samples (tools/samples.py get ${name})`);
    const peak = Math.max(...takes.map((t) => t.peak || 0.1));
    BANK[name] = (await Promise.all(takes.map(async (t) => ({ buf: await loadAudio(ctx, 'audio/samples/' + t.file),
      midi: t.midi, level: t.rms || 0.01, norm: 0.5 / peak })))).sort((a, b) => a.level - b.level);
  }
}
const noteName = (m) => ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'][m % 12] + (Math.floor(m / 12) - 1);
const midiOf = (n) => {
  if (typeof n === 'number') return n;
  const m = /^([A-G])(#|b)?(-?\d)$/.exec(n);
  if (!m) throw new Error(`sample: note "${n}" (write E5, F#3 or a MIDI number)`);
  return 'C D EF G A B'.indexOf(m[1]) + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + 12 * (+m[3] + 1);
};
function sample(ctx, out, name, t, o = {}) {
  const takes = BANK[name];
  if (!takes) throw new Error(`sample: "${name}" is not in INSTRUMENTS`);
  const pitched = takes.filter((k) => Number.isInteger(k.midi)), vel = clamp(o.vel ?? 0.7);
  let take = takes[Math.min(takes.length - 1, Math.floor(vel * takes.length))], rate = 1;
  if (o.note != null && pitched.length) {
    const want = midiOf(o.note);
    take = pitched.reduce((a, b) => (Math.abs(b.midi - want) < Math.abs(a.midi - want) ? b : a));
    if (Math.abs(want - take.midi) > 4 && !o.stretch) {
      const lo = Math.min(...pitched.map((k) => k.midi)), hi = Math.max(...pitched.map((k) => k.midi));
      throw new Error(`sample: ${name} ${o.note} is ${Math.abs(want - take.midi)} semitones from its nearest take (it plays `
        + `${noteName(lo)}–${noteName(hi)}): an octave ${want > hi ? 'lower' : 'higher'}, another player, or { stretch: true } for an effect`);
    }
    rate = Math.pow(2, (want - take.midi) / 12);
  }
  const src = ctx.createBufferSource(), g = ctx.createGain();
  src.buffer = take.buf; src.playbackRate.value = rate;
  g.gain.value = (o.gain ?? 0.8) * take.norm * (o.note != null ? 0.4 + 0.6 * vel : 1);
  let node = src.connect(g);
  if (o.pan) { const p = ctx.createStereoPanner(); p.pan.value = o.pan; node = node.connect(p); }
  node.connect(out); src.start(Math.max(0, t));
  return src;
}

function loadAudio(ctx, url) {              // a local WAV next to film.html (XHR works on file:// in the capture)
  return new Promise((ok, fail) => {
    const x = new XMLHttpRequest(); x.open('GET', url.replace(/#/g, '%23')); x.responseType = 'arraybuffer';
    x.onload = () => (x.status === 0 || x.status === 200) ? ctx.decodeAudioData(x.response).then(ok, fail)
      : fail(new Error(`own music: ${url} (${x.status})`));
    x.onerror = () => fail(new Error(`own music: could not load ${url}`)); x.send();
  });
}
window.renderAudio = async () => {
  const ctx = new OfflineAudioContext(2, Math.round(DURATION * SR), SR);
  const bus = ctx.createGain(); duck(bus.gain, 0.8, VO);
  const lim = ctx.createDynamicsCompressor();  // safety only; loudness is set afterwards by master_audio.py
  lim.threshold.value = -6; lim.knee.value = 6; lim.ratio.value = 8; lim.attack.value = 0.003; lim.release.value = 0.15;
  bus.connect(lim).connect(ctx.destination);
  ROOM_IN = makeRoom(ctx, bus);
  await loadSamples(ctx);
  SCENES.forEach((s, i) => { if (s.amb) ambience(ctx, wet(ctx, bus, 0.15), s.from, s.to, s.amb.kind, s.amb.gain, 300 + i); });
  for (const e of SFX) sfx(ctx, bus, e);
  if (OWN_MUSIC) {
    const src = ctx.createBufferSource(), gain = ctx.createGain();
    src.buffer = await loadAudio(ctx, OWN_MUSIC.file); gain.gain.value = OWN_MUSIC.gain ?? 0.8;
    src.connect(gain).connect(bus); src.start(0);
  } else score(ctx, bus);
  return ctx.startRendering();
};

window.READY = loadType(TYPE).then(loadFormulas).then(() => document.fonts.ready).then(() => {
  const qc = typeCheck(g, TYPE, W, H, PALETTE);  // missing glyphs or unreadable contrast stop here; warnings go to the log
  if (qc.errors.length) throw new Error('type check: ' + qc.errors.join(' · '));
  if (!OWN_MUSIC) checkArrangement();          // the user's own song brings its own arrangement
  return { frames: FRAMES, fps: FPS, width: W, height: H, renderer: 'canvas2d', qc: qc.warnings,
           title: TITLE, bounds: SCENES.map((s) => s.from).concat(DURATION), vo: VO.length,
           sfx: SFX.map((e) => [Math.round(e.at * 100) / 100, e.voice, e.dur ?? null]),
           palette: PALETTE, lookPalette: LOOK.palette, families: Object.values(TYPE.roles || {}).filter(Boolean).map((r) => r.family) };
});

// Text check (make.py runs it on drafts and finals, ?textcheck=1 only; renders never take this path). Every fillText and
// strokeText on a full-frame canvas is watched: its ink is the pixels it changed. Ink of two lines stacked over each
// other on the same pixels is an overlap; a piece of type whose face is within 2:1 of what is around half or more of
// its letters is low contrast. window.textCheck(frame) draws one frame and returns what it found there.
if (q.get('textcheck')) {
  const P = CanvasRenderingContext2D.prototype, owners = new WeakMap(), calls = [];
  let frameStart = 0, found = [];
  const lin = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
  const lum = (r, gg, b) => 0.2126 * lin(r) + 0.7152 * lin(gg) + 0.0722 * lin(b);
  const rgbOf = (s) => {
    if (typeof s !== 'string') return null;
    if (s[0] === '#' && s.length === 7) return [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16));
    const m = s.match(/rgba?\(([^)]+)\)/);
    return m ? m[1].split(',').slice(0, 3).map(Number) : null;
  };
  const watch = (orig, stroke) => function (str, x, y, ...rest) {
    const cv = this.canvas, s = String(str);
    if (cv.width !== W || cv.height !== H || !s.trim() || this.globalAlpha < 0.6) return orig.call(this, str, x, y, ...rest);
    const m = this.measureText(s), T = this.getTransform();
    const pts = [[x - m.actualBoundingBoxLeft, y - m.actualBoundingBoxAscent], [x + m.actualBoundingBoxRight, y - m.actualBoundingBoxAscent],
      [x - m.actualBoundingBoxLeft, y + m.actualBoundingBoxDescent], [x + m.actualBoundingBoxRight, y + m.actualBoundingBoxDescent]]
      .map(([px, py]) => [T.a * px + T.c * py + T.e, T.b * px + T.d * py + T.f]);
    const pad = 3 + (this.shadowBlur || 0) + Math.abs(this.shadowOffsetX || 0) + Math.abs(this.shadowOffsetY || 0);
    const x0 = Math.max(0, Math.floor(Math.min(...pts.map((p) => p[0])) - pad)), x1 = Math.min(W, Math.ceil(Math.max(...pts.map((p) => p[0])) + pad));
    const y0 = Math.max(0, Math.floor(Math.min(...pts.map((p) => p[1])) - pad)), y1 = Math.min(H, Math.ceil(Math.max(...pts.map((p) => p[1])) + pad));
    if (x1 - x0 < 2 || y1 - y0 < 2) return orig.call(this, str, x, y, ...rest);
    const before = this.getImageData(x0, y0, x1 - x0, y1 - y0).data;
    const result = orig.call(this, str, x, y, ...rest);
    const after = this.getImageData(x0, y0, x1 - x0, y1 - y0).data;
    const cap = Math.abs(T.d) * m.actualBoundingBoxAscent, base = T.b * x + T.d * y + T.f;
    const left = Math.min(...pts.map((p) => p[0])), right = Math.max(...pts.map((p) => p[0]));
    const last = calls.length > frameStart ? calls[calls.length - 1] : null, same = last && last.cv === cv;
    // the same string again at about the same place is a layer of one piece of type (extrusion, shadow, outline + fill)
    const layer = same && last.s === s && Math.abs(last.base - base) < 0.3 * cap && Math.abs(last.left - left) < 0.3 * cap;
    // apart: how far a baseline lies outside a piece of type's baselines (all its layers, an extrusion runs deep)
    const apart = (st, b) => Math.max(0, st.lo - b, b - st.hi);
    let run = same && apart(last.stack, base) <= 0.6 * Math.min(last.cap, cap) ? last.run : null;   // bouncing letters stay one line
    if (run && !layer) { run.label += (left - run.right > 0.25 * cap ? ' ' : '') + s; run.right = Math.max(run.right, right); }
    else if (!run) run = { label: s, right };
    let stack = layer ? last.stack : null;
    if (!stack) { if (last) settle(last.stack); stack = { run, ink: null, alpha: 0, cap: 0, overlapped: false, lo: base, hi: base }; }
    if (!stroke) { stack.ink = rgbOf(this.fillStyle); stack.alpha = this.globalAlpha; }   // a gradient face: colour unknown, not judged
    Object.assign(stack, { after, bw: x1 - x0, bh: y1 - y0, cap: Math.max(stack.cap, cap), lo: Math.min(stack.lo, base), hi: Math.max(stack.hi, base) });
    const id = calls.push({ s, base, cap, cv, run, left, right, stack }) - 1;
    let own = owners.get(cv);
    if (!own) { own = new Int32Array(W * H).fill(-1); owners.set(cv, own); }
    const hits = new Map(), bw = x1 - x0;
    for (let i = 0, n = before.length / 4; i < n; i++) {
      const k = i * 4;
      if (Math.abs(after[k] - before[k]) + Math.abs(after[k + 1] - before[k + 1]) + Math.abs(after[k + 2] - before[k + 2]) <= 30) continue;
      const idx = (y0 + Math.floor(i / bw)) * W + x0 + (i % bw), prev = own[idx];
      if (prev >= frameStart && calls[prev].run !== run && calls[prev].s !== s) hits.set(prev, (hits.get(prev) || 0) + 1);
      own[idx] = id;
    }
    for (const [prev, px] of hits) {          // only lines stacked over each other: letters side by side may touch by design
      const o = calls[prev], wide = Math.min(o.right - o.left, right - left);
      const gap = Math.max(0, o.stack.lo - stack.hi, stack.lo - o.stack.hi);
      const stacked = gap > 0.6 * Math.min(o.cap, cap) && Math.min(o.right, right) - Math.max(o.left, left) > 0.3 * wide;
      if (stacked && px >= 6) { found.push({ kind: 'overlap', a: o.run, b: run, px }); stack.overlapped = true; }
    }
    return result;
  };
  // The finished piece of type: its face (the last fill colour) against what is right around each letter after every
  // layer is drawn, so an outline or a shadow that separates the letters counts. A face that fills its whole box has
  // nothing around it: the type is lost in a ground of its own colour.
  function settle(st) {
    if (!st || st.done) return;
    st.done = true;
    if (!st.ink || st.overlapped || st.alpha < 0.85 || st.cap < 6) return;
    const [ir, ig, ib] = st.ink, li = lum(ir, ig, ib), { after, bw, bh } = st, R = Math.max(3, Math.round(st.cap * 0.12));
    const face = (xx, yy) => { const k = (yy * bw + xx) * 4; return Math.abs(after[k] - ir) + Math.abs(after[k + 1] - ig) + Math.abs(after[k + 2] - ib) < 48; };
    let faces = 0, low = 0, all = 0;
    for (let yy = 0; yy < bh; yy++) for (let xx = 0; xx < bw; xx++) {
      if (!face(xx, yy)) continue;
      faces++;
      if ((xx + yy) % 2) continue;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        let best = 0, edge = false;
        for (let d = 1; d <= R; d++) {
          const nx = xx + dx * d, ny = yy + dy * d;
          if (nx < 0 || ny < 0 || nx >= bw || ny >= bh) break;
          if (!edge && face(nx, ny)) continue;
          edge = true;
          const k = (ny * bw + nx) * 4, lb = lum(after[k], after[k + 1], after[k + 2]);
          best = Math.max(best, (Math.max(li, lb) + 0.05) / (Math.min(li, lb) + 0.05));
        }
        if (edge) { all++; if (best < 2) low++; }
      }
    }
    const share = faces > 0.7 * bw * bh ? 100 : all >= 20 ? Math.round((100 * low) / all) : 0;
    if (share >= 50) found.push({ kind: 'contrast', run: st.run, share });
  }
  P.fillText = watch(P.fillText, false);
  P.strokeText = watch(P.strokeText, true);
  window.textCheck = (frame) => {
    frameStart = calls.length; found = []; window.renderFrame(frame);
    if (calls.length > frameStart) settle(calls[calls.length - 1].stack);
    const out = new Map();                       // one finding per line pair (overlap) or line (contrast), the worst kept
    for (const f of found) {
      const r = f.kind === 'overlap' ? { kind: 'overlap', a: f.a.label, b: f.b.label, px: f.px } : { kind: 'contrast', s: f.run.label, share: f.share };
      if (r.kind === 'overlap' && r.a === r.b) continue;
      const key = r.kind === 'overlap' ? [r.a, r.b].sort().join('\u0000') : 'c\u0000' + r.s, old = out.get(key);
      if (!old || (r.px ?? r.share) > (old.px ?? old.share)) out.set(key, r);
    }
    return [...out.values()];
  };
}

// Preview in a normal browser: click renders the soundtrack offline and plays picture and sound together.
// The audio clock picks the frame; nothing is fed back into the render.
if (!q.get('capture')) {
  let frame = 0, playing = false, audio = null, src = null, t0 = 0, offset = 0;
  const hud = document.getElementById('hud');
  const stop = () => { if (src) { src.stop(); src = null; } playing = false; };
  const play = async () => {
    audio ??= new AudioContext();
    const buf = await window.renderAudio();
    src = audio.createBufferSource(); src.buffer = buf; src.connect(audio.destination);
    offset = frame / FPS; t0 = audio.currentTime; src.start(0, offset); playing = true;
    src.onended = () => { if (playing) { playing = false; frame = 0; } };
  };
  addEventListener('click', () => (playing ? stop() : play()));
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') playing ? stop() : play();
    if (e.code === 'ArrowRight') { stop(); frame = Math.min(FRAMES - 1, frame + 1); }
    if (e.code === 'ArrowLeft') { stop(); frame = Math.max(0, frame - 1); }
  });
  const loop = () => {
    if (playing) frame = Math.min(FRAMES - 1, Math.floor((audio.currentTime - t0 + offset) * FPS));
    window.renderFrame(frame);
    hud.textContent = `${TITLE} · frame ${frame}/${FRAMES - 1} · t=${(frame / FPS).toFixed(2)}s · ${playing ? 'playing' : 'click to play with sound'}`;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
